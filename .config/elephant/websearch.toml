# Web search engines for walker. Typing a query offers "Search: <query>";
# the prefixed engines are triggered inline, e.g. "!gh hyprland".
#
# Opened with xdg-open, which currently resolves to firefox.desktop even though
# Zen is the daily browser -- see `xdg-settings get default-web-browser`.
# Fixing that system-wide is preferable to overriding `command` here, since it
# also affects links opened from every other app.

[[entries]]
default = true
name = "Google"
url = "https://www.google.com/search?q=%TERM%"
icon = "google-chrome"

[[entries]]
name = "DuckDuckGo"
prefix = "!d"
url = "https://duckduckgo.com/?q=%TERM%"

[[entries]]
name = "GitHub"
prefix = "!gh"
url = "https://github.com/search?q=%TERM%"
icon = "github"

[[entries]]
name = "Arch Wiki"
prefix = "!aw"
url = "https://wiki.archlinux.org/index.php?search=%TERM%"

[[entries]]
name = "Arch Packages"
prefix = "!ap"
url = "https://archlinux.org/packages/?q=%TERM%"

[[entries]]
name = "YouTube"
prefix = "!yt"
url = "https://www.youtube.com/results?search_query=%TERM%"

[[entries]]
name = "Hyprland Wiki"
prefix = "!hw"
url = "https://wiki.hypr.land/?s=%TERM%"
