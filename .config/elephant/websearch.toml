# Web search engines for walker. Typing a query offers "Search: <query>";
# the prefixed engines are triggered inline, e.g. "!gh hyprland".
#
# Opens via xdg-open, which now resolves to Zen.
#
# Brand icons resolve because ~/.icons/WhiteSur-dark/index.theme inherits
# rose-pine-icons (a Papirus fork, ~117k icons). WhiteSur alone has ~6.4k and
# no brand icons, and a missing icon renders as GTK's crossed-out fallback.

[[entries]]
default = true
name = "Google"
url = "https://www.google.com/search?q=%TERM%"
icon = "google"

[[entries]]
name = "DuckDuckGo"
prefix = "!d"
url = "https://duckduckgo.com/?q=%TERM%"

[[entries]]
name = "GitHub"
prefix = "!gh"
url = "https://github.com/search?q=%TERM%"
icon = "github"

[[entries]]
name = "Arch Wiki"
prefix = "!aw"
url = "https://wiki.archlinux.org/index.php?search=%TERM%"

[[entries]]
name = "Arch Packages"
prefix = "!ap"
url = "https://archlinux.org/packages/?q=%TERM%"

[[entries]]
name = "YouTube"
prefix = "!yt"
url = "https://www.youtube.com/results?search_query=%TERM%"

[[entries]]
name = "Hyprland Wiki"
prefix = "!hw"
url = "https://wiki.hypr.land/?s=%TERM%"
