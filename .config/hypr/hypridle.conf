general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # avoid pressing a key twice to wake the display.
}

# NOTE: the old 150s "dim the backlight" listener was removed -- it called
# brightnessctl, which isn't installed, and this box has no backlight device
# (external DP monitor). Dimming an external panel needs ddcutil (DDC/CI).

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 600                                 # 10min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'  # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'    # screen on when activity resumes
}

