general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # avoid pressing a key twice to wake the display.
}

# NOTE: the old 150s "dim the backlight" listener was removed -- it called
# brightnessctl, which isn't installed, and this box has no backlight device
# (external DP monitor). Dimming an external panel needs ddcutil (DDC/CI).

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# NOTE: no dpms-off listener. The AW3926QW drops off DisplayPort when it
# sleeps, and Hyprland 0.57 crashes losing its only monitor while locked.
# Trade-off: the panel stays lit behind hyprlock until you power it off.

# listener {
#     timeout = 900                                 # 15min
#     on-timeout = systemctl suspend                # suspend pc
# }
