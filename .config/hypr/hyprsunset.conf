# Night light. Started from hyprland.lua autostart.
# Replaces the old redshift setup, which was X11-only and never ran on Wayland.

# Neutral during the day. Without an identity profile hyprsunset tints
# the screen by default.
profile {
    time = 07:00
    identity = true
}

# Warm after 20:00.
profile {
    time = 20:00
    temperature = 4000
}
